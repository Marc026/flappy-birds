<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1d33">
  <title>Flappy Birds</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Stage: the canvas renders the world; #ui is an HTML overlay for menus (see js/ui.js). -->
  <main id="stage">
    <canvas id="game" aria-label="Flappy Birds game"></canvas>
    <section id="ui"></section>
  </main>
  <!-- ES module entry point (serve over http/https; see README). -->
  <script type="module" src="js/main.js"></script>
</body>
</html>
